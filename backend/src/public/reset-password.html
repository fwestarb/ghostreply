<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redefinir senha — GhostReply</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.08);
  }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p { font-size: 13px; color: #6e6e73; line-height: 1.5; margin: 0 0 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #6e6e73; margin-bottom: 6px; }
  input {
    width: 100%; box-sizing: border-box; padding: 11px 14px; margin-bottom: 14px;
    border: 1px solid rgba(0,0,0,0.08); border-radius: 10px; font-size: 14px; outline: none;
  }
  input:focus { border-color: rgba(0,113,227,0.4); box-shadow: 0 0 0 4px rgba(0,113,227,0.08); }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 999px; background: #0071e3;
    color: white; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #feedback { font-size: 13px; margin-top: 14px; text-align: center; }
  #feedback.error { color: #b3261e; }
  #feedback.success { color: #1d7a3d; }
</style>
</head>
<body>
  <div class="card">
    <h1>Redefinir senha</h1>
    <p>Escolha uma nova senha para sua conta GhostReply.</p>
    <form id="reset-form">
      <label for="password">Nova senha</label>
      <input type="password" id="password" minlength="8" required autocomplete="new-password" />
      <label for="confirm">Confirmar senha</label>
      <input type="password" id="confirm" minlength="8" required autocomplete="new-password" />
      <button type="submit">Redefinir senha</button>
    </form>
    <div id="feedback"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const uid = params.get('uid');
    const token = params.get('token');
    const form = document.getElementById('reset-form');
    const feedback = document.getElementById('feedback');

    if (!uid || !token) {
      feedback.textContent = 'Link inválido ou incompleto.';
      feedback.className = 'error';
      form.querySelector('button').disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        feedback.textContent = 'As senhas não coincidem.';
        feedback.className = 'error';
        return;
      }

      const button = form.querySelector('button');
      button.disabled = true;
      feedback.textContent = '';
      feedback.className = '';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid, token, newPassword: password })
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data?.error?.message || 'Não foi possível redefinir a senha.');
        }

        feedback.textContent = 'Senha redefinida com sucesso. Você já pode fazer login novamente na extensão.';
        feedback.className = 'success';
        form.remove();
      } catch (err) {
        feedback.textContent = err.message;
        feedback.className = 'error';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
